# E2E stack (SPEC §8 stage 12, scripts/e2e.*): docker-compose.yml with this file on top.
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
# Its own project, so its own volumes (a clean database and Mailpit) and its own host ports: it runs
# beside the dev stack and never touches its data. APP_ENV=dev opens /api/dev/clock for the
# scenarios; a 1-minute digest window keeps the mail scenarios short.
name: health-tracker-e2e

x-e2e-env: &e2e-env
  APP_ENV: dev
  DIGEST_WINDOW_MINUTES: "1"
  APP_URL: http://localhost:5174

services:
  api:
    environment: *e2e-env
    ports: !override
      - "8001:8000"

  worker:
    environment: *e2e-env

  frontend:
    ports: !override
      - "5174:80"

  postgres:
    ports: !override
      - "5434:5432"

  mailpit:
    ports: !override
      - "1026:1025"
      - "8026:8025"
