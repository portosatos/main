# E2E stack (SPEC §8 stage 12, scripts/e2e.*): docker-compose.yml with this file on top.
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
# Its own project, so its own volumes (a clean database and Mailpit) and its own host ports: it runs
# beside the dev stack and never touches its data. APP_ENV=dev opens /api/dev/clock for the
# scenarios; a 1-minute digest window and a 5-second dispatcher tick keep the mail scenarios short
# (e2e/lib/env.ts DIGEST_TICK_MS).
name: health-tracker-e2e

x-e2e-env: &e2e-env
  APP_ENV: dev
  DIGEST_WINDOW_MINUTES: "1"
  DIGEST_TICK_S: "5"
  APP_URL: http://localhost:5174

services:
  api:
    environment: *e2e-env
    ports: !override
      - "8001:8000"

  worker:
    environment: *e2e-env
    # `up --wait` of older Compose (2.38 on CI runners) fails on a service without a healthcheck;
    # healthy here means the API reports the worker's heartbeat, so scenarios start with a live worker.
    healthcheck: !override
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; h = json.load(urllib.request.urlopen('http://api:8000/api/health', timeout=4)); raise SystemExit(h['worker']['status'] != 'ok')"
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 20

  frontend:
    ports: !override
      - "5174:80"

  postgres:
    ports: !override
      - "5434:5432"

  mailpit:
    ports: !override
      - "1026:1025"
      - "8026:8025"
