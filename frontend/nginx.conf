# Frontend in compose: the built SPA and /api proxied to the backend on the same origin
# (SPEC §6.1) — no CORS, session cookies work.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Telemetry files of ~200 MB are uploaded through this proxy (SPEC §4).
    client_max_body_size 300m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (/api/events): pass events through immediately, keep long-lived streams open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        # Stream uploads to the API instead of spooling the whole file first.
        proxy_request_buffering off;
    }

    location /assets/ {
        # Vite puts a content hash into every file name here.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # SPA routing: unknown paths get index.html; it must not be cached.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
