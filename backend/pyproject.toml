[project]
name = "health-tracker-backend"
version = "0.1.0"
description = "Health tracker API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "sse-starlette>=2.2",
    "structlog>=24.4",
    "tzdata>=2024.2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "hypothesis>=6.100",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: fast tests without external services (tests/unit)",
    "integration: tests against the test Postgres database (tests/integration)",
    "mailpit: tests that need a running Mailpit",
]
xfail_strict = true
