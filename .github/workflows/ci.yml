# Checks every push to main and every pull request: lint and tests of backend, generator, scripts/
# and frontend, the e2e scenarios on the e2e stack (Playwright), LF endings of *.sh, and the step
# process (WORKLOG and commits, scripts/check_process.py) and the docs (scripts/check_docs.py).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff, pytest)
    runs-on: ubuntu-latest
    services:
      # Same images and host ports as docker-compose.yml, so test defaults work unchanged.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: health
          POSTGRES_PASSWORD: health
          POSTGRES_DB: health_tracker
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U health -d health_tracker"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://health:health@localhost:5433/health_tracker_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # upstream has no moving major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        run: uv sync --project backend --locked
      - name: ruff check
        run: uv run --project backend ruff check .
      - name: ruff format --check
        run: uv run --project backend ruff format --check .
      - name: pytest backend (unit + integration)
        working-directory: backend
        run: uv run pytest
      - name: pytest scripts/
        run: uv run --project backend pytest scripts/tests -q

  generator:
    name: generator (pytest, htgen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # upstream has no moving major tag
        with:
          enable-cache: true
          cache-dependency-glob: generator/uv.lock
      - name: Install generator dependencies
        run: uv sync --project generator --locked
      - name: pytest generator
        working-directory: generator
        run: uv run pytest -q
      - name: htgen writes a 7-day file
        run: |
          uv run --project generator htgen --days 7 --seed 1 --out sample.ndjson
          test -s sample.ndjson
          wc -l sample.ndjson
          head -n 2 sample.ndjson
      - name: htgen writes 90 days with random gaps
        run: |
          uv run --project generator htgen --days 90 --devices watch,phone --gap-prob 0.05 --seed 42 --out big.ndjson
          test -s big.ndjson
          wc -l big.ndjson

  frontend:
    name: frontend (npm run check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci --prefix frontend
      - name: typecheck, lint, vitest, build
        run: npm --prefix frontend run check

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # upstream has no moving major tag
        with:
          enable-cache: true
          cache-dependency-glob: generator/uv.lock
      - name: Install generator dependencies (scenarios generate files with htgen)
        run: uv sync --project generator --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: npm ci
        run: npm ci --prefix e2e
      - name: Chromium with its system libraries
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: typecheck
        run: npm --prefix e2e run typecheck
      - name: scripts/e2e.sh (e2e stack + scenarios)
        run: scripts/e2e.sh
      - name: Logs of the e2e stack
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail 300
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  process:
    name: process (LF, check_process, check_docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # check_process.py walks the whole history
      - name: "*.sh are stored with LF"
        run: |
          files="$(git ls-files --eol -- '*.sh')"
          echo "$files"
          if [ -z "$files" ]; then echo "no *.sh files found"; exit 1; fi
          bad="$(echo "$files" | grep -v '^i/lf' || true)"
          if [ -n "$bad" ]; then echo "not LF in the index:"; echo "$bad"; exit 1; fi
      - name: check_process.py --all
        run: python3 scripts/check_process.py --all
      - name: check_docs.py
        run: python3 scripts/check_docs.py
