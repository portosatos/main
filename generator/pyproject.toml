[project]
name = "htgen"
version = "0.1.0"
description = "Health tracker test telemetry generator (NDJSON, docs/DATA_FORMAT.md)"
requires-python = ">=3.12,<3.13"
# zoneinfo has no system time zone database on Windows, tzdata provides it.
dependencies = ["tzdata>=2024.2"]

[project.scripts]
htgen = "htgen.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
