# Health tracker: local stack. Every value has a default, so `docker compose up --build` works
# on a fresh clone without .env; .env (see .env.example) only overrides them.
name: health-tracker

x-backend: &backend
  build: ./backend
  image: health-tracker-backend:dev
  init: true  # PID 1 forwards SIGTERM, so `docker compose stop` is instant
  environment:
    APP_ENV: ${APP_ENV:-dev}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-health}:${POSTGRES_PASSWORD:-health}@postgres:5432/${POSTGRES_DB:-health_tracker}
  depends_on:
    postgres:
      condition: service_healthy

services:
  api:
    <<: *backend
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true  # the image healthcheck probes the API port; the worker has no HTTP
    depends_on:
      # The API applies migrations on start; the worker reads dev_clock only after that.
      api:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: health-tracker-frontend:dev
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health}
      POSTGRES_DB: ${POSTGRES_DB:-health_tracker}
    ports:
      # 5433 on the host: 5432 is often taken by a locally installed PostgreSQL.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
